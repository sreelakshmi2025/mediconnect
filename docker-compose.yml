services:
  mysql:
    image: mysql:8.4
    container_name: mediconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mediconnect}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER before starting MySQL}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD before starting MySQL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting MySQL}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mediconnect_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mediconnect_mysql_data: